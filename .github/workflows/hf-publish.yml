name: Publish to Hugging Face Dataset

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'the-clinical-commons-poster.jpg'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag to publish'
        default: 'main'

permissions:
  id-token: write   # OIDC token for Hugging Face Trusted Publisher
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install huggingface_hub
        run: pip install --quiet huggingface_hub

      - name: Mint GitHub Actions OIDC token (audience=huggingface.co)
        id: oidc
        run: |
          URL=$(python3 -c "import os,urllib.parse;p=urllib.parse.urlsplit(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']);q=[(k,v) for k,v in urllib.parse.parse_qsl(p.query) if k!='audience']+[('audience','https://huggingface.co')];print(urllib.parse.urlunsplit(p._replace(query=urllib.parse.urlencode(q))))")
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$URL" | \
            python3 -c "import json,sys;print(json.load(sys.stdin)['value'])")
          echo "oidc_token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: "Debug: decode OIDC JWT claims"
        run: |
          python3 - <<'PY'
          import json, base64, os
          token = os.environ["OIDC_TOKEN"]
          def b64d(s):
              s += "=" * (-len(s) % 4)
              return base64.urlsafe_b64decode(s)
          payload = json.loads(b64d(token.split(".")[1]))
          print(json.dumps({k: payload.get(k) for k in ["iss","sub","aud","repository","workflow","ref"]}, indent=2))
          PY
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.oidc_token }}

      - name: Exchange OIDC for short-lived HF token
        id: exchange
        run: |
          BODY=$(curl -s -X POST https://huggingface.co/oauth/token \
            -H 'Content-Type: application/json' \
            -d "{\"grant_type\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\",\"subject_token\":\"${{ steps.oidc.outputs.oidc_token }}\",\"resource\":\"datasets/Fadil369/clinical-commons\"}")
          echo "$BODY"
          ACCESS_TOKEN=$(echo "$BODY" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('access_token',''))" 2>/dev/null || echo "")
          echo "hf_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Publish files to Hugging Face dataset
        env:
          HF_TOKEN: ${{ steps.exchange.outputs.hf_token }}
        run: |
          python3 - <<'PY'
          from huggingface_hub import HfApi
          import os
          tok = os.environ.get("HF_TOKEN", "")
          if not tok:
              print("NO_TOKEN: exchange failed, nothing published")
              raise SystemExit(0)
          api = HfApi(token=tok)
          for f in ["README.md", "the-clinical-commons-poster.jpg"]:
              api.upload_file(
                  path_or_fileobj=f,
                  path_in_repo=f,
                  repo_id="Fadil369/clinical-commons",
                  repo_type="dataset",
                  commit_message=f"[ci] Publish {f} via GitHub Actions OIDC",
              )
              print(f"uploaded {f}")
          print("DONE")
          PY
